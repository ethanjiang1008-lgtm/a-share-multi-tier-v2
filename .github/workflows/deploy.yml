name: V2 独立网页静态发布

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/v2.js"
      - "site/styles.css"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v2-independent-pages
  cancel-in-progress: false

jobs:
  deploy_site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout V2 repository
        uses: actions/checkout@v6
      - name: Validate checked-in V2 data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("site/data/multi_tier_v2_backtest.json").read_text(encoding="utf-8"))
          latest = json.loads(Path("site/data/multi_tier_latest.json").read_text(encoding="utf-8"))
          assert isinstance(report.get("levels"), dict), "Missing level metrics"
          assert latest.get("model_version") == "multi-tier-v2", "Latest prediction is not V2"
          print("V2 website data is valid.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload V2 website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"
      - name: Deploy independent V2 website
        id: deployment
        uses: actions/deploy-pages@v4
