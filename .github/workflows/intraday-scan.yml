name: V2 运行时点快照与次交易日晋级预测

on:
  workflow_dispatch:
  schedule:
    # 14:00 Asia/Shanghai = 06:00 UTC; weekday automatic scan.
    - cron: "0 6 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

# Prefer the most recently requested manual snapshot when runs overlap.
concurrency:
  group: v2-latest-signal
  cancel-in-progress: true

jobs:
  intraday_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.run_gate.outputs.publish }}
    steps:
      - name: Checkout V2 repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check scan and model utilities
        run: |
          python -m py_compile \
            scripts/multi_tier_scan.py \
            scripts/multi_tier_v2_backtest.py \
            scripts/market_data_sina.py \
            scripts/trading_calendar.py

      - name: Install V2 scoring dependency
        run: python -m pip install --disable-pip-version-check scikit-learn

      - name: Gate automatic run against A-share trading calendar (manual runs always allowed)
        id: run_gate
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "scripts")
          from trading_calendar import is_trading_day
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          publish = event != "schedule" or is_trading_day(now.date())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("publish=" + ("true" if publish else "false") + "\n")
          if not publish:
              print(f"Scheduled scan skipped: {now.date()} is not an A-share trading day.")
          else:
              print(f"Run allowed: event={event}, Beijing time={now.isoformat(timespec='seconds')}")
          PY

      - name: Generate latest available candidates
        if: steps.run_gate.outputs.publish == 'true'
        run: python scripts/multi_tier_scan.py

      - name: Validate run snapshot and next-trading-day target
        if: steps.run_gate.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from trading_calendar import next_trading_day

          payload = json.loads(Path("data/multi_tier_latest.json").read_text(encoding="utf-8"))
          if payload.get("status") != "ok":
              raise SystemExit(f"Invalid V2 scan status: {payload.get('status')}")
          analysis = payload.get("analysis_date")
          predicted = payload.get("prediction_date")
          mode = payload.get("analysis_mode")
          if not analysis or not predicted or not mode:
              raise SystemExit("V2 output must include analysis date, prediction date and run mode.")
          analysis_day = date.fromisoformat(analysis)
          expected = next_trading_day(analysis_day).isoformat()
          if predicted != expected:
              raise SystemExit(f"Wrong prediction horizon: analysis={analysis}, expected next trading day={expected}, got={predicted}")
          if not payload.get("run_at") or not payload.get("quote_snapshot_at"):
              raise SystemExit("V2 output must record actual run time and quote-snapshot time.")
          if mode in ("盘中最新行情快照（成交量按交易时长估算）", "盘后最新报价快照（日K尚未更新）"):
              if int(payload.get("live_quote_count") or 0) <= 0:
                  raise SystemExit("Quote-snapshot mode has no usable quote rows.")
          print(
              "V2 run snapshot validated:",
              analysis, "->", predicted,
              "| mode:", mode,
              "| quote snapshot at", payload.get("quote_snapshot_at"),
              "| stocks:", payload.get("live_quote_count")
          )
          PY

      - name: Sync latest prediction and backtest data into website folder
        if: steps.run_gate.outputs.publish == 'true'
        run: |
          mkdir -p site/data
          cp data/multi_tier_latest.json site/data/multi_tier_latest.json
          cp reports/multi_tier_v2_backtest.json site/data/multi_tier_v2_backtest.json

      - name: Commit latest run and website data
        if: steps.run_gate.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/multi_tier_latest.json site/data/multi_tier_latest.json site/data/multi_tier_v2_backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish intraday V2 signal for next trading day"
            git pull --rebase origin main
            git push
          else
            echo "Current intraday V2 result is unchanged."
          fi

  deploy_site:
    needs: intraday_scan
    if: needs.intraday_scan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: v2-independent-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest V2 repository state
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate signal freshness before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path("site/data/multi_tier_latest.json").read_text(encoding="utf-8"))
          assert latest.get("analysis_mode"), "Missing run mode"
          assert latest.get("run_at") and latest.get("quote_snapshot_at"), "Missing runtime timestamps"
          assert latest.get("analysis_date") and latest.get("prediction_date"), "Missing date horizon"
          print("Publishing latest run:", latest.get("analysis_date"), "->", latest.get("prediction_date"), "|", latest.get("analysis_mode"), "|", latest.get("run_at"))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload V2 site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"

      - name: Deploy independent V2 site
        id: deployment
        uses: actions/deploy-pages@v4
